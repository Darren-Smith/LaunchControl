<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woodland Protector</title>
    <link rel="stylesheet" href="style.css">
    <script src="/flask_sync.js"></script>
</head>
<body>
    <div id="ui-container">
        <div id="stats">
            <div id="lives-display">Lives: <span id="lives-count">5</span> ❤️</div>
            <div id="revives-display">Revives: <span id="revives-count">3</span> 🌟</div>
            <div id="level-display">Level: <span id="level-count">1</span></div>
            <div id="score-display">Score: <span id="score-count">0</span></div>
        </div>
        <div id="game-over" class="hidden">
            <h1>Game Over</h1>
            <p>Sir Fluffalot has fallen...</p>
            <button id="restart-btn">Restart</button>
        </div>
    </div>
    
    <!-- Load Three.js from CDN -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js?v=2"></script>
</body>
</html>
