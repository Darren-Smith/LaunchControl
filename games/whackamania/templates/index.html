<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whackamania</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}?v=2">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Bubblegum+Sans&display=swap" rel="stylesheet">
</head>
<body>
    <div id="mallet-cursor">
        <div id="mallet-inner">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <g transform="translate(15, 15) rotate(-30 50 50)">
                    <rect x="42" y="30" width="16" height="65" rx="8" fill="#8D6E63"/>
                    <rect x="40" y="60" width="20" height="30" rx="5" fill="#4E342E"/>
                    <rect x="15" y="5" width="70" height="35" rx="10" fill="#E64A19"/>
                    <rect x="10" y="10" width="10" height="25" rx="3" fill="#D84315"/>
                    <rect x="80" y="10" width="10" height="25" rx="3" fill="#D84315"/>
                    <!-- Target Aim Dot -->
                    <circle cx="10" cy="22.5" r="4" fill="rgba(255, 255, 255, 0.8)"/>
                    <circle cx="10" cy="22.5" r="2" fill="#B71C1C"/>
                </g>
            </svg>
        </div>
    </div>
    <div class="mole-decorator left-mole">
        <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" class="mole-svg">
            <path d="M -10 120 Q 50 80 110 120 Z" fill="#241710"/>
            <path d="M 25 120 C 25 30, 75 30, 75 120 Z" fill="#3a2a22"/>
            <ellipse cx="25" cy="72" rx="15" ry="8" fill="#d99999"/>
            <circle cx="12" cy="72" r="5" fill="#111"/>
            <g class="mole-eye">
                <circle cx="28" cy="52" r="7" fill="#fff"/>
                <circle class="pupil" cx="26" cy="52" r="3.5" fill="#111"/>
            </g>
            <g class="mole-eye">
                <circle cx="48" cy="52" r="7" fill="#fff"/>
                <circle class="pupil" cx="46" cy="52" r="3.5" fill="#111"/>
            </g>
            <g transform="translate(10, 95)">
                <path d="M 10 0 C 0 0, 0 15, 10 15 Z" fill="#eebb99"/>
                <line x1="0" y1="3" x2="-5" y2="5" stroke="#111" stroke-width="1.5"/>
                <line x1="0" y1="7" x2="-6" y2="9" stroke="#111" stroke-width="1.5"/>
                <line x1="1" y1="11" x2="-5" y2="13" stroke="#111" stroke-width="1.5"/>
            </g>
            <g transform="translate(40, 95)">
                <path d="M 10 0 C 0 0, 0 15, 10 15 Z" fill="#eebb99"/>
                <line x1="0" y1="3" x2="-5" y2="5" stroke="#111" stroke-width="1.5"/>
                <line x1="0" y1="7" x2="-6" y2="9" stroke="#111" stroke-width="1.5"/>
                <line x1="1" y1="11" x2="-5" y2="13" stroke="#111" stroke-width="1.5"/>
            </g>
        </svg>
    </div>
    <div id="game-container">
        
        <!-- Main Menu -->
        <div id="screen-main" class="screen active">
            <h1 class="game-title">Whackamania!</h1>
            <p class="subtitle">Stop the Cheeky moles!</p>
            <div class="menu-buttons">
                <button id="btn-start" class="btn primary">Play Game</button>
                <button id="btn-highscores" class="btn secondary">High Scores</button>
            </div>
        </div>

        <!-- Level Selection -->
        <div id="screen-levels" class="screen hidden">
            <h2>Select a Theme</h2>
            <div id="level-grid" class="level-grid">
                <!-- Level cards generated by JS -->
            </div>
            <button id="btn-back-main" class="btn secondary small mt-4">Back</button>
        </div>

        <!-- Game Screen -->
        <div id="screen-game" class="screen hidden">
            <div id="hud">
                <div class="hud-item">
                    <span class="hud-label">Score</span>
                    <span id="score-display" class="hud-value">0</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">Time</span>
                    <span id="time-display" class="hud-value">02:00</span>
                </div>
                <div class="hud-item center">
                    <span id="level-theme-display" class="hud-value theme-name">Theme</span>
                </div>
                <div class="hud-item right">
                    <button id="btn-pause" class="btn warning small">Pause</button>
                </div>
            </div>
            
            <div id="game-board-container">
                <div id="game-board" class="board-3x3">
                    <!-- Holes generated by JS -->
                </div>
            </div>
            
            <div id="feedback-toast" class="toast hidden"></div>
        </div>

        <!-- Pause Menu -->
        <div id="screen-pause" class="modal hidden">
            <div class="modal-content">
                <h2>Game Paused</h2>
                <div class="menu-buttons">
                    <button id="btn-resume" class="btn primary">Resume</button>
                    <button id="btn-restart" class="btn warning">Restart Level</button>
                    <button id="btn-quit" class="btn danger">Quit to Menu</button>
                </div>
            </div>
        </div>

        <!-- Game Over -->
        <div id="screen-game-over" class="screen hidden">
            <h2>Time's Up!</h2>
            <div class="final-score-container">
                <p>Your Score: <span id="final-score" class="highlight">0</span></p>
                <p id="high-score-message"></p>
                <div id="name-entry-container" style="display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; margin-top: 20px;">
                    <p style="margin: 0; font-size: 1.2rem;">New High Score!</p>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="player-name-input" placeholder="Your Name" maxlength="15" />
                        <button id="btn-save-score" class="btn primary small">Save</button>
                    </div>
                </div>
            </div>
            <div class="menu-buttons" id="end-menu-buttons">
                <button id="btn-play-again" class="btn primary">Play Again</button>
                <button id="btn-menu-from-end" class="btn secondary">Main Menu</button>
            </div>
        </div>
        
        <!-- High Scores -->
        <div id="screen-highscores-view" class="screen hidden">
            <h2>Top Detectives</h2>
            <ul id="highscores-list" class="leaderboard">
                <!-- Scores generated by JS -->
            </ul>
            <button id="btn-back-from-scores" class="btn secondary small mt-4">Back</button>
        </div>

    </div>
    <div class="mole-decorator right-mole">
        <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" class="mole-svg">
            <path d="M -10 120 Q 50 80 110 120 Z" fill="#241710"/>
            <path d="M 25 120 C 25 30, 75 30, 75 120 Z" fill="#3a2a22"/>
            <ellipse cx="25" cy="72" rx="15" ry="8" fill="#d99999"/>
            <circle cx="12" cy="72" r="5" fill="#111"/>
            <g class="mole-eye">
                <circle cx="28" cy="52" r="7" fill="#fff"/>
                <circle class="pupil" cx="26" cy="52" r="3.5" fill="#111"/>
            </g>
            <g class="mole-eye">
                <circle cx="48" cy="52" r="7" fill="#fff"/>
                <circle class="pupil" cx="46" cy="52" r="3.5" fill="#111"/>
            </g>
            <g transform="translate(10, 95)">
                <path d="M 10 0 C 0 0, 0 15, 10 15 Z" fill="#eebb99"/>
                <line x1="0" y1="3" x2="-5" y2="5" stroke="#111" stroke-width="1.5"/>
                <line x1="0" y1="7" x2="-6" y2="9" stroke="#111" stroke-width="1.5"/>
                <line x1="1" y1="11" x2="-5" y2="13" stroke="#111" stroke-width="1.5"/>
            </g>
            <g transform="translate(40, 95)">
                <path d="M 10 0 C 0 0, 0 15, 10 15 Z" fill="#eebb99"/>
                <line x1="0" y1="3" x2="-5" y2="5" stroke="#111" stroke-width="1.5"/>
                <line x1="0" y1="7" x2="-6" y2="9" stroke="#111" stroke-width="1.5"/>
                <line x1="1" y1="11" x2="-5" y2="13" stroke="#111" stroke-width="1.5"/>
            </g>
        </svg>
    </div>

    <script src="{{ url_for('static', filename='js/game.js') }}?v=2"></script>
    <script>
        document.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            
            document.querySelectorAll('.mole-decorator').forEach(mole => {
                const rect = mole.getBoundingClientRect();
                const moleX = rect.left + rect.width / 2;
                const moleY = rect.top + rect.height / 2;
                
                let dx = mouseX - moleX;
                const dy = mouseY - moleY;
                
                if (mole.classList.contains('left-mole')) {
                    dx = -dx;
                }
                
                const angle = Math.atan2(dy, dx);
                const distance = Math.min(3.5, Math.hypot(dx, dy) / 60);
                
                const xOffset = Math.cos(angle) * distance;
                const yOffset = Math.sin(angle) * distance;
                
                mole.querySelectorAll('.pupil').forEach(pupil => {
                    pupil.setAttribute('transform', `translate(${xOffset}, ${yOffset})`);
                });
            });
            
            // Move mallet
            const malletCursor = document.getElementById('mallet-cursor');
            if (malletCursor) {
                malletCursor.style.transform = `translate(${mouseX}px, ${mouseY}px)`;
            }
        });

        document.addEventListener('mousedown', () => {
            const malletInner = document.getElementById('mallet-inner');
            if (malletInner) malletInner.classList.add('bashing');
        });
        
        document.addEventListener('mouseup', () => {
            const malletInner = document.getElementById('mallet-inner');
            if (malletInner) malletInner.classList.remove('bashing');
        });
    </script>
</body>
</html>
