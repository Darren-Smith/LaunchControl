name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach artifact to (e.g. v1.1.0). If empty, version.json is used.'
        required: false
        default: ''
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows release bundle
        run: |
          python scripts/build_release.py --skip-sync

      - name: Upload workflow build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaunchControl-windows-x64
          path: |
            release/*.zip
            release/SHA256SUMS
          if-no-files-found: error

      - name: Determine Release Tag
        id: release_tag
        shell: pwsh
        run: |
          $inputTag = "${{ github.event.inputs.tag }}"
          $refName = "${{ github.ref_name }}"
          if ($inputTag -ne "") {
              $tag = $inputTag
          } elseif ($refName -match "^v\d+\.\d+\.\d+") {
              $tag = $refName
          } else {
              $ver = (Get-Content -Raw version.json | ConvertFrom-Json).version
              $tag = "v$ver"
          }
          Write-Output "Resolved release tag: $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.release_tag.outputs.tag }}"
          Write-Output "Checking for GitHub release: $tag"
          $rel = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
              Write-Output "Attaching Windows release zip and SHA256SUMS to release $tag..."
              $zipFile = (Get-Item release/LaunchControl-*-windows-x64.zip).FullName
              $sumsFile = (Get-Item release/SHA256SUMS).FullName
              gh release upload $tag $zipFile --clobber
              gh release upload $tag $sumsFile --clobber
              Write-Output "Upload complete!"
          } else {
              Write-Output "Release $tag does not exist on GitHub yet. Artifact saved to workflow run."
          }
